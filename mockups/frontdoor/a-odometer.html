<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crucible - Direction A - Odometer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Archivo:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0906;
  --ink:#fff6e8;
  --dim:#a08e78;
  --accent:#ff4800;
  --accent2:#ffb020;
  --pop:#3ddc7f;
  --radius:0px;              /* SHAPE LOCK: direction A is all-sharp */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);
  font-family:Archivo,system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{image-rendering:pixelated}

/* ---------- ambient ---------- */
.heat{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(90% 60% at 8% 104%, rgba(255,72,0,.42), transparent 62%),
    radial-gradient(70% 50% at 92% 0%, rgba(255,176,32,.12), transparent 60%);}
.grain{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.35;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.5'/></svg>");}

.wrap{position:relative;z-index:2;min-height:100dvh;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:max(14px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
  max-width:1400px;margin:0 auto}

/* ---------- top ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px}
.mark{font-family:"Press Start 2P",monospace;font-size:11px;letter-spacing:.02em;color:var(--accent2)}
.livechip{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--pop);
  border:1px solid rgba(61,220,127,.4);padding:7px 9px;
  display:inline-flex;align-items:center;gap:7px;background:rgba(61,220,127,.07)}
.blip{width:6px;height:6px;background:var(--pop);animation:blip 1.4s steps(2,end) infinite}
@keyframes blip{0%,60%{opacity:1}61%,100%{opacity:.15}}

/* ---------- stage: asymmetric, number bleeds left ---------- */
.stage{display:grid;grid-template-columns:1fr;align-content:center;gap:22px;padding:18px 0 8px;position:relative}

.kicker{font-family:"Press Start 2P",monospace;font-size:9px;line-height:1.9;color:var(--dim)}
.kicker b{color:var(--ink);font-weight:400}

.potwrap{position:relative;margin-left:-2vw}
.pot{font-weight:900;font-size:clamp(78px,26vw,220px);line-height:.78;letter-spacing:-.055em;
  color:var(--ink);text-shadow:0 0 60px rgba(255,72,0,.55);
  font-variant-numeric:tabular-nums;display:flex;align-items:flex-start}
.pot .cur{font-size:.38em;color:var(--accent);margin-top:.16em;margin-right:.04em}
.tick{display:inline-block;animation:tick .9s cubic-bezier(.16,1,.3,1)}
@keyframes tick{from{transform:translateY(-.14em);opacity:0}to{transform:none;opacity:1}}

.crackline{font-family:"Press Start 2P",monospace;font-size:clamp(9px,2.8vw,13px);
  line-height:1.8;color:var(--accent2);margin-top:14px}

/* ---------- today strip: warden gets real presence, no overlap on the figure ---------- */
.today{border-top:1px solid rgba(255,246,232,.13);border-bottom:1px solid rgba(255,246,232,.13);
  padding:16px 0;display:flex;align-items:center;gap:16px}
.today img{width:clamp(96px,27vw,132px);flex:none;
  filter:drop-shadow(0 14px 30px rgba(0,0,0,.75));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
.today .t1{font-family:"Press Start 2P",monospace;font-size:clamp(10px,3vw,13px);color:var(--ink);line-height:1.7}
.today .t2{font-size:clamp(13px,3.7vw,16px);color:var(--pop);font-weight:600;margin-top:7px;line-height:1.35}

/* ---------- price of entry ---------- */
.maths{display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;gap:10px;
  font-weight:900;font-size:clamp(19px,5.6vw,30px);letter-spacing:-.02em}
.maths .in{color:var(--dim)}
.maths .arrow{color:var(--accent);font-size:.8em}
.maths .out{color:var(--pop)}
.mathsnote{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--dim);margin-top:9px;line-height:1.9}

/* ---------- CTA ---------- */
.cta{display:block;width:100%;border:0;cursor:pointer;
  background:linear-gradient(180deg,var(--accent2),var(--accent));
  color:#210b00;font-family:"Press Start 2P",monospace;font-size:clamp(13px,3.7vw,17px);
  padding:24px 18px;letter-spacing:.02em;
  box-shadow:0 8px 0 #7d2400, 0 20px 44px rgba(255,72,0,.42);
  transition:transform .12s cubic-bezier(.16,1,.3,1), box-shadow .12s;
  animation:breathe 2.6s ease-in-out infinite}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 0 #7d2400,0 24px 52px rgba(255,72,0,.55)}
.cta:active{transform:translateY(6px);box-shadow:0 2px 0 #7d2400,0 8px 20px rgba(255,72,0,.4)}
@keyframes breathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.11)}}
.subcta{text-align:center;font-family:"Press Start 2P",monospace;font-size:8px;color:var(--dim);
  margin-top:14px;line-height:1.9}
.subcta a{color:var(--accent2);text-decoration:none;border-bottom:1px solid rgba(255,176,32,.35)}

.bottom{padding-top:20px}

@media (min-width:860px){
  .wrap{padding-left:56px;padding-right:56px}
  .stage{grid-template-columns:1.35fr .65fr;align-items:center;gap:40px;padding:40px 0}
  .potwrap{margin-left:-14px}
  .today img{width:clamp(132px,13vw,178px)}
  .rightcol{display:grid;gap:26px}
  .bottom{display:grid;grid-template-columns:1fr auto;gap:34px;align-items:end}
  .cta{padding:28px 64px;width:auto}
  .subcta{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="heat"></div><div class="grain"></div>

<div class="wrap">

  <header class="top">
    <div class="mark">CRUCIBLE</div>
    <div class="livechip"><span class="blip"></span>LIVE</div>
  </header>

  <main class="stage">
    <div>
      <p class="kicker">THE CHEST HOLDS</p>
      <div class="potwrap">
        <div class="pot"><span class="cur">$</span><span class="tick">12.40</span></div>
      </div>
      <p class="crackline">ANY HIT CAN CRACK IT OPEN</p>
    </div>

    <div class="rightcol">
      <div class="today">
        <img src="art/ronke.png" alt="Today's Warden, a Ronke">
        <div>
          <div class="t1">TODAY: RONKE</div>
          <div class="t2">Ronkeverse holders hit 5% harder</div>
        </div>
      </div>

      <div>
        <div class="maths">
          <span class="in">under 1&cent; a swing</span>
          <span class="arrow">&#9654;</span>
          <span class="out">$12.40 pot</span>
        </div>
        <p class="mathsnote">3&cent; FORGES A WEAPON. 5 SWINGS MINIMUM.</p>
      </div>
    </div>
  </main>

  <footer class="bottom">
    <div>
      <button class="cta">HIT THE WARDEN</button>
      <p class="subcta">No wallet? Look around first. <a href="#">How it works</a></p>
    </div>
  </footer>

</div>
</body>
</html>
